name: OKX Demo Bot Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m py_compile bot.py
          echo "✅ bot.py syntax OK"

      # 持续运行（不限时，直到你手动取消或触达 GitHub Actions 最长运行时间）
      # 需要在仓库 Settings → Secrets and variables → Actions 中配置：
      # OKX_API_KEY / OKX_SECRET_KEY / OKX_PASSPHRASE
      - name: Run OKX Demo Bot (continuous)
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
        run: |
          echo "开始持续运行模拟盘机器人（不限时，直到你手动取消）..."
          python -u bot.py
