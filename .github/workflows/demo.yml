name: OKX Demo Bot Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m py_compile bot.py
          echo "✅ bot.py syntax OK"

      # 测试运行（带超时）
      # 需要在仓库 Settings → Secrets and variables → Actions 中配置：
      # OKX_API_KEY / OKX_SECRET_KEY / OKX_PASSPHRASE
      - name: Run OKX Demo Bot (10 min test)
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
        run: |
          echo "开始模拟盘测试（最多运行 10 分钟后自动结束）..."
          timeout 600s python -u bot.py || {
            exit_code=$?
            if [ $exit_code -eq 124 ]; then
              echo ""
              echo "✅ 测试完成：机器人已按预期运行满 10 分钟并正常超时退出"
              echo "（这是预期行为，不是错误）"
              exit 0
            else
              echo "❌ 机器人异常退出，退出码: $exit_code"
              exit $exit_code
            fi
          }
