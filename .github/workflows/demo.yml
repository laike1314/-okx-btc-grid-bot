name: OKX Demo Bot Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m py_compile bot.py
          echo "✅ bot.py syntax OK"

      # 运行模拟盘（需要先在仓库 Settings → Secrets and variables → Actions 中配置以下三个 Secrets）
      # OKX_API_KEY
      # OKX_SECRET_KEY
      # OKX_PASSPHRASE
      - name: Run OKX Demo Bot
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
        run: |
          python -u bot.py
