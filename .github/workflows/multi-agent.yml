name: OKX Multi-Agent Demo

# 手动触发的多代理模拟盘。与 demo.yml（旧 bot.py）互不影响。
# 私有仓库免费 Actions 分钟有限；平台大约 6 小时会强制取消 job。
# 默认 --hours 5.8 --stop-after-flat：到时后等最后一笔平仓再退出，方便后面的 artifact 步骤跑完。
# Secrets（仓库 Settings → Secrets and variables → Actions，与旧工作流共用）：
#   OKX_API_KEY / OKX_SECRET_KEY / OKX_PASSPHRASE
# 本项目代码里 SIMULATED_TRADING 固定为模拟盘，这里不会改成实盘。

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "运行小时数（once 为 true 时忽略）。默认 5.8，留出余量避开约 6 小时强制取消。"
        required: false
        default: "5.8"
        type: string
      once:
        description: "只跑一轮扫描后退出（检查连通性/信号）。默认 false，按 hours 持续运行。"
        required: false
        default: false
        type: boolean
      strategy:
        description: "scalp = 现有快进快出（默认）。swing_combo = 单次波段会话，持仓不会在退出时被平掉。长期跑请用工作流 OKX Swing Combo。"
        required: false
        default: scalp
        type: choice
        options:
          - scalp
          - swing_combo
      reset_halt:
        description: "仅 swing_combo：清除账户 -20% 停机并重设起点权益。默认 false。"
        required: false
        default: false
        type: boolean

# 剥头皮沿用原来的并发组，会取消上一次手动运行。
# 选了 swing_combo 时并入 okx-swing-combo，且不取消正在跑的波段循环，避免两个策略同时打同一个模拟盘。
# 不会动 demo.yml。

permissions:
  contents: write
  actions: write

jobs:
  demo:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.event.inputs.strategy == 'swing_combo' && 'okx-swing-combo' || format('okx-multi-agent-demo-{0}', github.ref) }}
      cancel-in-progress: ${{ github.event.inputs.strategy != 'swing_combo' }}
    env:
      # 与 config.py 的 MA-1.2.2 默认一致，避免 Actions 环境里残留旧变量。
      ENABLE_US_STOCKS: "0"
      SIGNAL_BAR: "5m"
      TREND_BAR: "15m"
      MIN_SIGNAL_SCORE: "7"
      MIN_ADX: "28"
      ATR_SL_MULT: "2.5"
      MIN_SL_PCT: "0.004"
      RISK_REWARD: "1.0"
      MAX_HOLD_SEC: "900"
      SYMBOL_COOLDOWN_SEC: "900"
      LOSS_COOLDOWN_SEC: "1800"
      MAX_CONSECUTIVE_LOSSES: "3"
      MAX_SAME_DIR_CRYPTO: "2"
      REENTRY_BAR: "5m"
      CHASE_LIMIT_PCT: "0.0015"
      MIN_VOL_USDT_24H: "10000000"
      MAX_MARK_INDEX_BPS: "50"
      MAX_COST_TO_R: "0.30"
      MIN_EDGE_FEE_MULT: "3.5"
      MAKER_ENTRY_TIMEOUT_SEC: "25"
      PROTECT_AUDIT_SEC: "30"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r okx-multi-agent/requirements.txt

      - name: Syntax check
        run: |
          python -m py_compile \
            okx-multi-agent/main.py \
            okx-multi-agent/config.py \
            okx-multi-agent/okx_client.py \
            okx-multi-agent/universe.py \
            okx-multi-agent/agents/*.py
          echo "syntax OK"

      # 离线冒烟：Mock 行情，不联网、不读密钥。产物在 data_smoke/，不进正式 data/。
      - name: Offline smoke
        working-directory: okx-multi-agent
        env:
          STRATEGY: scalp
        run: python main.py --smoke --steps 30

      - name: Offline smoke swing
        working-directory: okx-multi-agent
        env:
          STRATEGY: swing_combo
        run: python main.py --smoke --steps 12

      - name: Restore swing-data
        if: ${{ inputs.strategy == 'swing_combo' }}
        run: bash okx-multi-agent/scripts/swing_data.sh restore

      - name: Run one scan round
        if: ${{ inputs.once }}
        working-directory: okx-multi-agent
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          STRATEGY: ${{ inputs.strategy || 'scalp' }}
          DATA_DIR: ${{ inputs.strategy == 'swing_combo' && format('{0}/swing-data', github.workspace) || format('{0}/okx-multi-agent/data', github.workspace) }}
          SWING_RESET_HALT: ${{ inputs.reset_halt && '1' || '0' }}
        run: |
          echo "单轮扫描（--once）strategy=${STRATEGY} ..."
          python -u main.py --once

      - name: Run timed demo
        if: ${{ !inputs.once }}
        working-directory: okx-multi-agent
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          RUN_HOURS: ${{ inputs.hours }}
          STRATEGY: ${{ inputs.strategy || 'scalp' }}
          DATA_DIR: ${{ inputs.strategy == 'swing_combo' && format('{0}/swing-data', github.workspace) || format('{0}/okx-multi-agent/data', github.workspace) }}
          SWING_RESET_HALT: ${{ inputs.reset_halt && '1' || '0' }}
        run: |
          if [ "$STRATEGY" = "swing_combo" ]; then
            echo "swing_combo 运行 ${RUN_HOURS} 小时，到点保留持仓并退出..."
            python -u main.py --hours "$RUN_HOURS"
          else
            echo "持续运行 ${RUN_HOURS} 小时，到时后等持仓平完再退出..."
            python -u main.py --hours "$RUN_HOURS" --stop-after-flat
          fi

      - name: Publish swing-data branch
        if: ${{ always() && inputs.strategy == 'swing_combo' }}
        env:
          SWING_DATA_DIR: ${{ github.workspace }}/swing-data
        run: bash okx-multi-agent/scripts/swing_data.sh publish

      # job 失败、到时退出或被取消后都尽量留下日志和权益曲线。
      - name: Upload data artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okx-multi-agent-data-${{ github.run_id }}
          path: okx-multi-agent/data/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload swing-data artifact
        if: ${{ always() && inputs.strategy == 'swing_combo' }}
        uses: actions/upload-artifact@v4
        with:
          name: okx-swing-data-${{ github.run_id }}
          path: swing-data/
          retention-days: 14
          if-no-files-found: warn
